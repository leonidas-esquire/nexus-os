name: WASM execution
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'examples/deterministic-agent/**', 'Cargo.toml', '.github/workflows/wasm-execution.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'examples/deterministic-agent/**', 'Cargo.toml', '.github/workflows/wasm-execution.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
